events {}
http {
  # Never log OAuth codes, cookies, or query strings.
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080 default_server;
    server_name 127.0.0.1;
    absolute_redirect off;
    port_in_redirect off;
    if ($http_host != "127.0.0.1:3319") { return 400; }
    location = /oauth2/auth {
      internal;
      proxy_pass http://oauth:4180/oauth2/auth;
      proxy_pass_request_body off;
      proxy_pass_request_headers off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host 127.0.0.1:3319;
      proxy_set_header X-Forwarded-Proto http;
    }
    # Ignore caller-supplied rd values; staging has one post-auth destination.
    location = /oauth2/start {
      # A variable URI replaces (rather than appends) caller query arguments.
      set $fixed_oauth_start "/oauth2/start?rd=/dev";
      proxy_pass http://oauth:4180$fixed_oauth_start;
      proxy_pass_request_headers off;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host 127.0.0.1:3319;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Host 127.0.0.1:3319;
      proxy_set_header X-Forwarded-Port 3319;
      proxy_set_header X-Auth-Request-Redirect http://127.0.0.1:3319/dev;
      limit_except GET HEAD { deny all; }
    }
    location /oauth2/ {
      proxy_pass http://oauth:4180;
      proxy_pass_request_headers off;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host 127.0.0.1:3319;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-Host 127.0.0.1:3319;
      proxy_set_header X-Forwarded-Port 3319;
      limit_except GET HEAD { deny all; }
    }
    # Fixed external authority: never derive a browser-visible port from the
    # container's internal :8080 listener and never accept a caller rd target.
    location = /api/auth/login { return 302 http://127.0.0.1:3319/oauth2/start?rd=/dev; }
    location / {
      auth_request /oauth2/auth;
      auth_request_set $verified_uid $upstream_http_x_auth_request_user;
      auth_request_set $verified_username $upstream_http_x_auth_request_preferred_username;
      auth_request_set $verified_email $upstream_http_x_auth_request_email;
      auth_request_set $verified_groups $upstream_http_x_auth_request_groups;
      # API calls stay 401 when unauthenticated; explicit /api/auth/login starts SSO.
      include /etc/nginx/verified-headers.conf;
      proxy_pass http://ui:3000;
      # Authentication qualification only; inference/write gate remains closed.
      limit_except GET HEAD { deny all; }
    }
  }
}
