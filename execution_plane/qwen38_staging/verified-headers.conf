# Drop all client headers; allow only necessary transport headers and verified claims.
proxy_pass_request_headers off;
proxy_set_header Host 127.0.0.1:3319;
proxy_set_header X-Forwarded-Proto http;
proxy_set_header X-Forwarded-Host 127.0.0.1:3319;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept $http_accept;
proxy_set_header User-Agent $http_user_agent;
proxy_set_header X-authentik-username $verified_username;
proxy_set_header X-authentik-uid $verified_uid;
# The staging client does not request Authentik's unverified local email claim.
# Do not mislabel the preferred_username session key as an email upstream.
proxy_set_header X-authentik-email "";
proxy_set_header X-authentik-name $verified_username;
proxy_set_header X-authentik-groups $verified_groups;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_http_version 1.1;
proxy_buffering off;
proxy_read_timeout 600s;
