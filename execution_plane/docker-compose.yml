# LOVELACE EXECUTION PLANE - PHASE 3
# Removed: Traefik, Prometheus, Grafana, Loki, Promtail, cAdvisor, Redis monitoring
# Kept: Compute services (Ollama, ComfyUI, BMO Voice, OpenHands, Agent Runtime, Agent UI, Ops Portal)
# NOTE: Services are now accessed through Turing Traefik Gateway on port 80/443
# Routing: Lovelace (192.168.2.101) <- Turing Traefik (192.168.2.103:80) <- Existing media stack

services:
  # Docker Socket Proxy - exposes container metadata for cross-node health checks
  # Access restricted to Turing (192.168.2.103) via iptables DOCKER-USER rules on the host.
  # POST=1 enables container restart/exec for management; safe only because iptables limits
  # who can reach port 2375 to trusted nodes. Windows management: SSH to Lovelace directly.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy-execution
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - PING=1
      - VERSION=1
      - EVENTS=0
      - POST=1        # Allows restart/exec; secured by host iptables allowlist
      - AUTH=0
      - BUILD=0
      - IMAGES=0
      - NETWORKS=0
      - VOLUMES=0
      - SYSTEM=0
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "192.168.2.101:2375:2375"  # Bind to LAN IP only, not 0.0.0.0
    networks:
      - execution_net

  # SPIRE AGENT - Workload Identity Provider
  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.10.1
    container_name: spire-agent
    hostname: spire-agent
    volumes:
      - ./config/spire:/etc/spire/agent
      - spire_agent_data:/run/spire/agent
      - spire_socket:/var/run/spire  # Shared socket for workloads
      - //var/run/docker.sock:/var/run/docker.sock:ro
    # pid: "host"
    command: ["-config", "/etc/spire/agent/agent.conf"]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-agent", "healthcheck", "-socketPath", "/var/run/spire/agent.sock"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - execution_net
    restart: unless-stopped

  # OLLAMA SERVICE - GPU Accelerated Inference
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_gpu
    # Enable GPU Support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
        # Hard cap on system RAM for the Ollama container.
        # Model weights live in VRAM; this RAM budget covers the binary,
        # request buffering, tokeniser, and any KV-cache overflow.
        # 6 GB is ~3× the container's observed idle RSS and gives headroom
        # for a 128k-context KV cache spill without starving other containers.
        limits:
          memory: 6g
    environment:
      # Dual-GPU MoE: Both 5060 Ti GPUs available for expert model serving
      - OLLAMA_FLASH_ATTENTION=1       # Flash attention = ~40% less KV cache memory
      - OLLAMA_NUM_PARALLEL=1          # 1 slot: KV cache halved so 14B models (~14.2 GB) fit on a 16 GB GPU
      - OLLAMA_KEEP_ALIVE=1h            # Unload after 1h idle; cold loads spike WSL2 RAM, keeping warm amortizes that cost
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: always
    networks:
      - execution_net

  # FRIDAY'S DEDICATED OLLAMA — pinned to GPU 1, isolated from the swarm (2026-07-14).
  # The shared ollama_gpu couldn't keep Friday's qwen3:8b resident (the swarm kept evicting it,
  # causing 23-47s reload spikes = "voice stops at intent"). This instance pins qwen3:8b to GPU 1
  # alone (keep_alive=-1); bmo_brain targets it via BMO_OLLAMA_URL=http://ollama_friday:11434.
  # Shares the ollama_models volume so qwen3:8b needs no re-download. No host port (reached by
  # container DNS on execution_net). NOTE: CUDA_VISIBLE_DEVICES is THIS host's GPU-1 UUID — on
  # different hardware refresh it via `docker exec ollama_friday nvidia-smi -L`, or the pin
  # silently falls back to all GPUs and the isolation is lost.
  ollama_friday:
    image: ollama/ollama:latest
    container_name: ollama_friday
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
        limits:
          memory: 6g
    environment:
      - CUDA_VISIBLE_DEVICES=GPU-b23f2137-ee9f-b8db-84fa-cdb6425d473e  # Lovelace GPU 1 (RTX 5060 Ti)
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - execution_net

  # VOICE ENGINE - Qwen3-TTS (1.7B)
  # Replaced the retired bmo-voice RVC service (models lost); owns host port 8100
  # so the .106 driver connects unchanged.
  voice-engine:
    build:
      context: ../services/voice_engine
      dockerfile: Dockerfile
    container_name: voice_engine_gpu
    ports:
      - "8020:8020"
      - "8100:8020"   # BMO driver (.106, default port 8100) connects here
    environment:
      # ALL of Friday's voice path (brain + STT + TTS) lives on the NON-display card GPU-b23f2137
      # = Task Manager "GPU 0" (nvidia-smi index 1). The monitor is on GPU-0236956d = Task Manager
      # "GPU 1", which is left to Windows. Friday's full stack ~14.8 GB fits the 16 GB card (~1.2 GB
      # free); voice_engine (Qwen3-TTS-1.7B + SenseVoice + speaker) is ~5.5 GB warmed, but its CUDA
      # graphs pre-allocate inference buffers at warmup so synthesis doesn't grow further.
      # count:all injects both GPUs; CUDA_VISIBLE_DEVICES filters CUDA to Friday's card only.
      - CUDA_VISIBLE_DEVICES=GPU-b23f2137-ee9f-b8db-84fa-cdb6425d473e  # Task Manager GPU 0 = Friday's card
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped
    volumes:
      - ../services/voice_engine:/app
      - bmo_models:/root/.cache/huggingface # Share cache if possible or use new volume
    networks:
      - execution_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voice-engine.rule=PathPrefix(`/voice`)"
      - "traefik.http.routers.voice-engine.entrypoints=web"
      - "traefik.http.services.voice-engine.loadbalancer.server.port=8020"

  # WYOMING FRIDAY TTS - protocol adapter only, no synthesis of its own. Lets Home
  # Assistant's Assist pipeline select Friday's cloned voice_engine/Qwen3-TTS voice as a
  # first-class local TTS engine (same voice the Pi hears), instead of only being reachable
  # via voice_engine's own HTTP API. Wraps voice-engine's existing /speak endpoint.
  wyoming-friday-tts:
    build:
      context: ../services/wyoming_friday_tts
      dockerfile: Dockerfile
    container_name: wyoming_friday_tts
    ports:
      - "10200:10200"
    environment:
      - VOICE_ENGINE_URL=http://voice-engine:8020
    restart: unless-stopped
    depends_on:
      - voice-engine
    networks:
      - execution_net

  # GPU-ACCELERATED WYOMING WHISPER STT - replaces HA's CPU-bound "Whisper" Supervisor
  # add-on (runs on the HA host itself, .100, no GPU). Live pipeline traces measured
  # 3.2-6.2+ seconds of pure Whisper transcription time after VAD already isolated the
  # speech segment — the dominant bottleneck in the whole voice pipeline, and one trace
  # failed to recognize speech at all (an accuracy problem from the add-on's likely
  # tiny/base-int8 default model, not just a speed problem). Unlike wyoming-friday-tts,
  # this is a complete, self-contained Wyoming server (the rhasspy package IS the server,
  # no separate HTTP backend to bridge to) — no PyTorch dependency at all, transcription
  # runs through CTranslate2 directly. Deliberately staged: build + smoke-test on this
  # container BEFORE registering it with HA or repointing the Friday pipeline's stt_engine
  # — keep the existing CPU stt.faster_whisper entity as a fallback during burn-in.
  wyoming-whisper-gpu:
    build:
      context: ../services/wyoming_whisper_gpu
      dockerfile: Dockerfile
    container_name: wyoming_whisper_gpu
    environment:
      # Silero VAD gate for the STT decoder (start.sh --vad-threshold). 0.3 default; lower passes
      # quieter speech but risks silence-hallucinations. The durable fix for quiet audio is the
      # ESPHome mic gain (google-mini-voice.yaml auto_gain/volume_multiplier), not this.
      - WHISPER_VAD_THRESHOLD=${WHISPER_VAD_THRESHOLD:-0.3}
      # STT on Friday's card GPU-b23f2137 = Task Manager "GPU 0" (nvidia-smi index 1), alongside the
      # brain and TTS. Whisper is only ~1.4 GB. count:all injects both GPUs; this filters to Friday's card.
      - CUDA_VISIBLE_DEVICES=GPU-b23f2137-ee9f-b8db-84fa-cdb6425d473e  # Task Manager GPU 0 = Friday's card
    ports:
      - "10300:10300"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped
    volumes:
      - whisper_models:/data
    networks:
      - execution_net

  # BMO BRAIN - OpenAI-compatible vault-RAG conversational assistant, speaking as BMO/Beemo.
  # Recalls personal-vault (MemPalace) memories, injects them as context, and answers via
  # the LLM. Canonical brain for both HA's OpenAI-Conversation agent and the BMO Pi's
  # bmo_driver.chat() (which targets :8000/v1). Personal vault values live in
  # execution_plane/.env (gitignored); vault recall is inert unless BMO_VAULT_URL +
  # BMO_VAULT_OWNER are set there. To override the character prompt entirely, add
  # "- BMO_PERSONA=${BMO_PERSONA}" below — not set by default (services/bmo_brain/persona.py
  # is the default character).
  # FRIDAY BRAIN — the HA-Assist conversation agent (renamed from bmo-brain 2026-07-14).
  # bmo_brain was always Friday's pipeline; the BMO voice HARDWARE lives under agents/bmo_voice
  # and is unrelated. Env var NAMES keep the BMO_ prefix for .env compatibility (the gitignored
  # .env still supplies BMO_VAULT_URL/BMO_OLLAMA_URL/etc.); container-internal names (VAULT_URL,
  # OLLAMA_URL) are what main.py reads and are unchanged. Port 8000 and the bmo_brain_data volume
  # are preserved so HA (192.168.2.101:8000) + the Pi driver + the /app/data cache are unaffected.
  friday-brain:
    build:
      context: ../services/friday_brain
      dockerfile: Dockerfile
    container_name: friday_brain
    ports:
      - "8000:8000"
    environment:
      - VAULT_URL=${BMO_VAULT_URL}
      - VAULT_OWNER=${BMO_VAULT_OWNER}
      - OLLAMA_URL=${BMO_OLLAMA_URL:-http://192.168.2.101:11434}
      - BMO_MODEL=${BMO_MODEL:-qwen3:8b}
      # Swarm delegation: delegate_to_swarm hands heavy research/build tasks to agent_runtime's
      # OpenAI-compatible endpoint (NOT friday_brain's own :8000). The tool short-circuits until set.
      - AGENT_RUNTIME_URL=${BMO_AGENT_RUNTIME_URL}
      # HA API access for tools.py's device-control tools (self-executing mode) and, new,
      # hass_resolver.py's fuzzy-matching + learned-synonym resolution of area/entity
      # names for HA passthrough mode — previously missing from this container entirely,
      # so tools.py's turn_on_device/turn_off_device/get_device_state/list_devices were
      # silently non-functional here too.
      - HOME_ASSISTANT_URL=${HOME_ASSISTANT_URL:-http://192.168.2.100:8123}
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN}
      # Consult-Claude offload (claude_consult.py) — Friday asks Claude Opus 4.8 for help ONLY
      # after the user opts in on that turn. HARD NO-OP until BOTH are set: add ANTHROPIC_API_KEY
      # to the gitignored execution_plane/.env, then flip FRIDAY_CONSULT_ENABLED=true. Budget +
      # log persist in the bmo_brain_data volume; default cap $5/month, fail-closed.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FRIDAY_CONSULT_ENABLED=${FRIDAY_CONSULT_ENABLED:-false}
      - FRIDAY_CONSULT_MODEL=${FRIDAY_CONSULT_MODEL:-claude-opus-4-8}
      - FRIDAY_CONSULT_EFFORT=${FRIDAY_CONSULT_EFFORT:-high}
      - FRIDAY_CONSULT_MONTHLY_BUDGET_USD=${FRIDAY_CONSULT_MONTHLY_BUDGET_USD:-5.0}
      - FRIDAY_CONSULT_BUDGET_FILE=/app/data/consult_budget.json
      - FRIDAY_CONSULT_LOG=/app/data/consult_log.jsonl
      # Proactive announce: slow swarm/Claude consults ack instantly, then speak the result on the
      # satellite with no wake word. The chime plays first (preannounce_media_id) — upload the mp3 via
      # HA's Media -> Local Media and it resolves as media-source://media_source/local/<file>. Clear
      # FRIDAY_ANNOUNCE_CHIME to go back to a silent announcement.
      - FRIDAY_ANNOUNCE_CHIME=${FRIDAY_ANNOUNCE_CHIME:-media-source://media_source/local/snowpiercer_chime.mp3}
      - FRIDAY_ANNOUNCE_TARGET=${FRIDAY_ANNOUNCE_TARGET:-assist_satellite.google_mini_voice_assist_satellite}
      - FRIDAY_SWARM_ANNOUNCE=${FRIDAY_SWARM_ANNOUNCE:-true}
      # Swarm handoff: 'auto' sends no mode flag so agent_runtime's own router picks the depth. The
      # clarify gate asks ONE question on a vague ask (spoken via start_conversation so the mic reopens)
      # and parks the original ask for FRIDAY_CLARIFY_TTL seconds awaiting the answer.
      - FRIDAY_SWARM_MODE=${FRIDAY_SWARM_MODE:-auto}
      - FRIDAY_SWARM_CLARIFY=${FRIDAY_SWARM_CLARIFY:-true}
      - FRIDAY_CLARIFY_TTL=${FRIDAY_CLARIFY_TTL:-90}
      # The container has no system TZ, so datetime.now() is UTC. FRIDAY_TZ is the local IANA zone used
      # by the get_current_time/date tools and as the fallback for the prompt-injected clock (main.py
      # prefers HA's own configured time_zone when reachable). Without this, Friday reports UTC (~5h off).
      - FRIDAY_TZ=${FRIDAY_TZ:-America/Chicago}
      # Brain swap: "Hey Friday, brain swap" toggles the LLM between BMO_MODEL (default) and this
      # experimental model. Runtime-only (resets to default on restart). FRIDAY_BRAIN_SWAP=false disables.
      - FRIDAY_ALT_BRAIN=${FRIDAY_ALT_BRAIN:-goekdenizguelmez/JOSIEFIED-Qwen3:8b}
      - FRIDAY_BRAIN_SWAP=${FRIDAY_BRAIN_SWAP:-true}
      # Per-brain persona + memory + visual-reference management. Each brain (default vs the
      # brain-swap alt) carries its own persona, its own isolated memory namespace, and its own
      # visual refs — all editable at http://192.168.2.101:8000/personas (mtime-cached, no restart).
      # personas.json + visual_refs/ live in the bmo_brain_data volume (persist across rebuilds).
      # FRIDAY_PERSONA_TOKEN guards the LAN editor + CRUD API; empty = open on the LAN (default).
      # Set a secret before exposing /personas externally via the Turing Traefik route (Phase B).
      - FRIDAY_PERSONA_TOKEN=${FRIDAY_PERSONA_TOKEN:-}
    volumes:
      - bmo_brain_data:/app/data
    restart: unless-stopped
    networks:
      # Keep bmo_brain/bmo-brain as network aliases so any container-DNS caller using the old
      # name still resolves during the transition. HA + the Pi connect by host IP:8000 (unaffected).
      execution_net:
        aliases:
          - bmo_brain
          - bmo-brain

  # OPENHANDS - Sandboxed Execution Environment (Protected by Authentik SSO)
  openhands:
    build:
      context: .
      dockerfile: Dockerfile.openhands
    image: custom-openhands:latest
    container_name: openhands_sandbox
    privileged: true # Required for Docker-in-Docker sandboxing
    environment:
      - SANDBOX_USER_ID=1000
    ports:
      - "3002:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../workspace:/workspace
    networks:
      - execution_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openhands.rule=PathPrefix(`/hands`)"
      - "traefik.http.routers.openhands.entrypoints=web"
      - "traefik.http.routers.openhands.middlewares=strip-hands,authentik@docker"
      - "traefik.http.middlewares.strip-hands.stripprefix.prefixes=/hands"
      - "traefik.http.services.openhands.loadbalancer.server.port=3000"

  # DEV SANDBOX - Isolated container for browser-based terminal (Phase 1B)
  dev-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.dev-sandbox
    image: home-ai-lab/dev-sandbox:latest
    container_name: dev_sandbox
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ../:/workspace  # Live repo bind mount — Dev terminal operates on real files
    networks:
      - execution_net

  # AGENT RUNTIME - Custom Python Environment for Agno Agents
  agent-runtime:
    build:
      context: ..
      dockerfile: execution_plane/Dockerfile
    image: home-ai-lab/agent-runtime:latest
    container_name: agent_runtime
    restart: always
    depends_on:
      - ollama
      - openhands
      - comfyui
      - spire-agent  # Wait for SPIRE Agent
    env_file:
      - ../network.env
    environment:
      # Lovelace local Ollama — 2x 5060 Ti (32GB VRAM) handles all heavy models
      - OLLAMA_HOST=http://ollama:11434
      # Local Ollama — BMO voice uses qwen3:14b (9.2GB VRAM, fits alongside other services)
      - BMO_OLLAMA_HOST=http://ollama:11434
      # Fish Audio cloud TTS for BMO voice (overrides local RVC).
      # FISH_AUDIO_API_KEY is injected via env_file (network.env) and intentionally
      # NOT set here — an `environment:` entry would override env_file, and the
      # ${..} form resolves from execution_plane/.env, not network.env.
      - FISH_AUDIO_MODEL_ID=323847d4c5394c678e5909c2206725f6
      - OPENHANDS_URL=http://openhands:3000
      - OPENHANDS_API_KEY=sk-sandbox-local
      - COMFYUI_HOST=http://comfyui_gpu:8188
      - KLEIN_HOST=http://klein_service:8189
      # This agent_runtime is co-located with klein_service on Lovelace, so it
      # owns the docker socket needed for the WDDM container-restart eviction phase.
      # Remote agent_runtimes (Turing) must leave this unset; they rely on Klein's
      # in-process /evict to release VRAM.
      - EVICT_CONTAINER_RESTART=true
      - "VALID_API_KEYS={\"sk-coder-identity\": \"coding_user\", \"sk-devops-identity\": \"devops_user\"}"
      # Open Design daemon (LAN-accessible from agent_runtime on same execution_net)
      - OPEN_DESIGN_URL=http://open_design:7456
      # SPIFFE Workload API socket path
      - SPIFFE_ENDPOINT_SOCKET=unix:///var/run/spire/agent.sock
      - PYTHONPATH=/app
      # MemPalace API — direct to Hopper (no Turing-side gateway exists).
      - MEMPALACE_API_URL=${MEMPALACE_API_URL:-http://192.168.2.102:8200}
      # Agent session storage + Template registry
      - AGNO_DB_URL=${AGNO_DB_URL}
      - TEMPLATE_DB_URL=${TEMPLATE_DB_URL}
      # Redis GPU mutex (control plane)
      - REDIS_HOST=192.168.2.102
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # GPU peer lock server — Lovelace IS the lock server (localhost).
      # GPU_LOCK_SECRET is injected automatically via env_file (network.env).
      - GPU_LOCK_HOST=http://localhost:8000
      # Home Assistant Integration
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN}
      # BMO Voice LLM — qwen3:14b fits in VRAM (9.2GB < 15.93GB); latency masked by async ack
      - BMO_LLM_MODEL=qwen3:14b
      # Warm-pin the voice model so Friday is resident from boot. Roll back: set false
      # (or remove) + recreate. (gpu_queue.py)
      - WARM_PIN_PROTECTED_MODELS=true
      # PROTECT FRIDAY'S ACTUAL BRAIN: qwen3:8b (served by Lovelace), NOT the qwen3:14b
      # BMO_LLM_MODEL default that PROTECTED_OLLAMA_MODELS would otherwise inherit. Benchmark
      # 2026-07-14 confirmed qwen3:8b is Friday's deployed brain (median 0.49s warm, 100% tool
      # reliability); without this the eviction-protection guarded the wrong model and Friday hit
      # 50-60s reload spikes ("stops at intent") when the swarm evicted her from the shared GPU.
      - PROTECTED_OLLAMA_MODELS=qwen3:8b
      # BMO Weather location (Open-Meteo, no API key needed)
      - HOME_LAT=${HOME_LAT:-41.8781}
      - HOME_LON=${HOME_LON:--87.6298}
      - HOME_CITY=${HOME_CITY:-your area}
      # Heavy models — all served by Lovelace Ollama (2x 5060 Ti, 32GB combined)
      # ROUTER_MODEL uses 8b: fits alongside Klein (22GB) so routing never blocks on VRAM.
      # All execution models (coordinator, architect, workers) use 14b after Klein is evicted.
      - PRIMARY_MODEL=${PRIMARY_MODEL:-qwen3:14b}
      - ROUTER_MODEL=${ROUTER_MODEL:-qwen3:8b}
      - ARCHITECT_MODEL=${ARCHITECT_MODEL:-qwen3:14b}
      - COORDINATOR_MODEL=${COORDINATOR_MODEL:-qwen3:14b}
      - LIBRARIAN_MODEL=${LIBRARIAN_MODEL:-qwen3:14b}
      - CONV_MODEL=${CONV_MODEL:-qwen3:14b}
      # Swarm-on-DevHarness: route coder/architect/devops workers through DevHarness
      # on dev_sandbox instead of phidata Agents on host /workspace.  Safe because
      # both containers share the same ../:/workspace bind mount (same host path,
      # UID 1000 in both), so delivered_artifacts and any other host-fs consumers
      # see sandbox writes immediately.
      - SWARM_DEVHARNESS_WORKERS=true
      # Connected Accounts — external LLM providers (BYOK)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      # Dev workspace identity — Lovelace has no Traefik forward-auth, so requests
      # arrive without Authentik headers. This pins the fallback uid to the real owner
      # so local dev can see the same projects as prod.
      - DEV_OWNER_UID=misterobots
    volumes:
      - ../agents:/app/agents
      - ../:/workspace
      - C:/Users/panca/Documents/ComfyUI/ComfyUI/output:/app/comfy_io/output
      - C:/Users/panca/Documents/ComfyUI/ComfyUI/input:/app/comfy_io/input
      - //var/run/docker.sock:/var/run/docker.sock:ro
      - spire_socket:/var/run/spire:ro  # Mount SPIRE socket (read-only)
    # Grant read access to Docker socket (GID 0 on Windows Docker Desktop)
    group_add:
      - "0"
    command: ["uvicorn", "agents.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "debug"]
    ports:
      - "8008:8000"
    networks:
      - execution_net
    labels:
      # Labels for SPIRE workload attestation
      - "spiffe.io/spiffe-id=spiffe://home-ai-lab/agent/runtime"

  # IMAGE LORA WORKER - Dedicated queue consumer for image training prep / execution
  image-training-worker:
    build:
      context: ..
      dockerfile: execution_plane/Dockerfile
    image: home-ai-lab/agent-runtime:latest
    container_name: image_training_worker
    restart: always
    depends_on:
      - comfyui
      - spire-agent
    env_file:
      - ../network.env
    environment:
      - COMFYUI_HOST=http://comfyui_gpu:8188
      - PYTHONPATH=/app
      - REDIS_HOST=192.168.2.102
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AGNO_DB_URL=${AGNO_DB_URL}
      - TEMPLATE_DB_URL=${TEMPLATE_DB_URL}
      - TRAINING_OUTPUT_DIR=/workspace/training_output
      - TRAINING_DATASET_DIR=/workspace/training_data
      - IMAGE_LORA_TRAINER_COMMAND=${IMAGE_LORA_TRAINER_COMMAND:-python /app/agents/training/diffusers_lora_train.py --manifest {dataset_manifest} --output_dir {output_dir} --base_checkpoint {base_checkpoint} --trigger_word {trigger_word} --steps {steps} --lr {learning_rate}}
      - COMFYUI_CHECKPOINT_DIR=/home/runner/ComfyUI/models/checkpoints
      - SPIFFE_ENDPOINT_SOCKET=unix:///var/run/spire/agent.sock
    volumes:
      - ../agents:/app/agents
      - ../:/workspace
      - C:/Users/panca/Documents/ComfyUI/ComfyUI/output:/app/comfy_io/output
      - C:/Users/panca/Documents/ComfyUI/ComfyUI/models/checkpoints:/home/runner/ComfyUI/models/checkpoints:ro
      - spire_socket:/var/run/spire:ro
    command: ["python", "/app/agents/training/image_lora_worker.py"]
    networks:
      - execution_net
    labels:
      - "spiffe.io/spiffe-id=spiffe://home-ai-lab/agent/image-training-worker"

  # --- KLEIN INFERENCE SERVICE (FLUX.1-schnell + Kijai FP8 transformer, dual-GPU) ---
  klein_service:
    build:
      context: ..
      dockerfile: execution_plane/Dockerfile.klein
    image: home-ai-lab/klein-service:latest
    container_name: klein_service
    restart: always
    env_file:
      - ../network.env
    environment:
      - KLEIN_MODEL_ID=${KLEIN_MODEL_ID:-black-forest-labs/FLUX.1-schnell}
      - OUTPUT_DIR=/output
      - HF_HOME=/model_cache
      # cuda:0 — CLIP + T5-XXL (~9.7 GB bfloat16)
      # cuda:1 — FP8 transformer (~8.6 GB) + VAE (~0.5 GB)
    volumes:
      - C:/Users/panca/Documents/ComfyUI_app/output:/output:rw
      - klein_model_cache:/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']
              capabilities: [gpu]
    ports:
      - "8290:8189"
    networks:
      execution_net:
        aliases:
          - klein_service

  # --- OMNIGEN2 COMPOSITION SERVICE (multi-character scene composer) ---
  # Mutually exclusive with klein_service at the GPU layer — request_lock's
  # zone-switch evicts one before warming the other. Both target the "image"
  # zone; the lock metadata's image_engine field selects which to warm.
  omnigen_service:
    build:
      context: ..
      dockerfile: execution_plane/Dockerfile.omnigen
    image: home-ai-lab/omnigen-service:latest
    container_name: omnigen_service
    restart: always
    env_file:
      - ../network.env
    environment:
      - OMNIGEN_MODEL_ID=${OMNIGEN_MODEL_ID:-OmniGen2/OmniGen2}
      - OMNIGEN_QUANTIZATION=${OMNIGEN_QUANTIZATION:-fp8}
      - OUTPUT_DIR=/output
      - HF_HOME=/model_cache
    volumes:
      - C:/Users/panca/Documents/ComfyUI_app/output:/output:rw
      - omnigen_model_cache:/model_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # device_ids=['1'] = same physical 5060 Ti as ComfyUI. OmniGen2 FP8
              # (~12 GB) fits with headroom. ComfyUI is evicted in the image zone
              # before either Klein or OmniGen warms up, so no contention.
              device_ids: ['1']
              capabilities: [gpu]
    ports:
      - "8291:8190"
    networks:
      execution_net:
        aliases:
          - omnigen_service

  # --- COMFYUI (Creature Minsky — specialized workflows: LoRA, 3D, action figures) ---
  comfyui:
    image: comfyui:blackwell-sm120
    container_name: comfyui_gpu
    hostname: comfyui
    restart: always
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--highvram", "--disable-cuda-malloc"]
    ports:
      - "8188:8188"
    volumes:
      - C:/Users/panca/Documents/ComfyUI_app/models:/home/runner/ComfyUI/models:ro
      - C:/Users/panca/Documents/ComfyUI_app/output:/home/runner/ComfyUI/output:rw
      - C:/Users/panca/Documents/ComfyUI_app/input:/home/runner/ComfyUI/input:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    networks:
      execution_net:
        aliases:
          - comfyui
          - comfyui_gpu
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfyui.rule=PathPrefix(\\/comfy\\)"
      - "traefik.http.routers.comfyui.entrypoints=web"
      - "traefik.http.routers.comfyui.middlewares=strip-comfy,authentik@docker"
      - "traefik.http.middlewares.strip-comfy.stripprefix.prefixes=/comfy"
      - "traefik.http.services.comfyui.loadbalancer.server.port=8188"

  # --- VS CODE SERVER (DevOps - Full Access, Protected by Authentik SSO) ---
  agent_ide_devops:
    image: lscr.io/linuxserver/code-server:latest
    container_name: agent_ide_devops
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=${VSCODE_PASSWORD}
      - SUDO_PASSWORD=${VSCODE_SUDO_PASSWORD}
      - DEFAULT_WORKSPACE=/config/workspace
      - SWARM_API_KEY=sk-devops-identity
    volumes:
      - ../:/config/workspace
      - vscode_config_devops:/config
      - ./init_ide:/custom-cont-init.d:ro
    ports:
      - "8443:8443"
    restart: unless-stopped
    networks:
      - execution_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ide-devops.rule=PathPrefix(`/devops`)"
      - "traefik.http.routers.ide-devops.entrypoints=web"
      - "traefik.http.routers.ide-devops.middlewares=strip-devops,authentik@docker"
      - "traefik.http.middlewares.strip-devops.stripprefix.prefixes=/devops"
      - "traefik.http.services.ide-devops.loadbalancer.server.port=8443"

  # --- VS CODE SERVER (Coding - Restricted Sandbox, Protected by Authentik SSO) ---
  agent_ide_coding:
    image: lscr.io/linuxserver/code-server:latest
    container_name: agent_ide_coding
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD=${VSCODE_PASSWORD}
      - SUDO_PASSWORD=${VSCODE_SUDO_PASSWORD}
      - DEFAULT_WORKSPACE=/config/workspace
      - SWARM_API_KEY=sk-coder-identity
    volumes:
      - ../user_projects:/config/workspace
      - vscode_config_coding:/config
      - ./init_ide:/custom-cont-init.d:ro
    ports:
      - "8444:8443"
    restart: unless-stopped
    networks:
      - execution_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ide-coding.rule=PathPrefix(`/code`)"
      - "traefik.http.routers.ide-coding.entrypoints=web"
      - "traefik.http.routers.ide-coding.middlewares=strip-code,authentik@docker"
      - "traefik.http.middlewares.strip-code.stripprefix.prefixes=/code"
      - "traefik.http.services.ide-coding.loadbalancer.server.port=8443"

  # AGENT UI - Streamlit Interface (Protected by Authentik SSO)
  agent-ui:
    image: home-ai-lab/agent-runtime:latest
    container_name: agent_ui
    depends_on:
      - ollama
      - agent-runtime
      - comfyui
    env_file:
      - ../network.env
    environment:
      - AGNO_DB_URL=${AGNO_DB_URL}
      - OLLAMA_HOST=http://ollama:11434
      - COMFYUI_HOST=http://comfyui_gpu:8188
      - STREAMLIT_THEME_BASE=dark
      - STREAMLIT_THEME_PRIMARY_COLOR=#00ffff
      - STREAMLIT_THEME_BACKGROUND_COLOR=#0e1117
      - STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR=#1c1c2e
      - STREAMLIT_THEME_TEXT_COLOR=#e0e0e0
    volumes:
      - ../agents:/app/agents
      - ../:/workspace
      - C:/Users/panca/Documents/ComfyUI/ComfyUI/output:/app/comfy_io/output
      - C:/Users/panca/Documents/ComfyUI/ComfyUI/input:/app/comfy_io/input
    working_dir: /workspace
    command: [ "streamlit", "run", "agents/ui.py", "--server.port=8501", "--server.address=0.0.0.0" ]
    ports:
      - "8501:8501"
    networks:
      - execution_net
    labels:
      - "traefik.enable=true"
      # Route: /ai -> Agent UI (works from any host including Tailscale)
      - "traefik.http.routers.agent-ui.rule=PathPrefix(`/ai`)"
      - "traefik.http.routers.agent-ui.entrypoints=web"
      - "traefik.http.routers.agent-ui.middlewares=strip-ai,authentik@docker"
      - "traefik.http.middlewares.strip-ai.stripprefix.prefixes=/ai"
      - "traefik.http.services.agent-ui.loadbalancer.server.port=8501"
      # Authentik Forward Auth Middleware (shared by all services)
      - "traefik.http.middlewares.authentik.forwardauth.address=http://authentik_server:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name,X-authentik-uid"

  # OPS PORTAL - Admin Dashboard (Protected by Authentik SSO)
  ops-portal:
    image: home-ai-lab/agent-runtime:latest
    container_name: ops_portal
    user: "0"  # Run as root for Docker socket access
    depends_on:
      - agent-runtime
    env_file:
      - ../network.env
    environment:
      - AGNO_DB_URL=${AGNO_DB_URL}
      # Langfuse connection now sourced from network.env
      - LANGFUSE_HOST=${LANGFUSE_HOST}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
    volumes:
      - ../agents:/app/agents
      - ../docs:/app/docs
      - ../:/workspace
      - //var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    command: [ "streamlit", "run", "agents/ops_dashboard.py", "--server.port=8502", "--server.address=0.0.0.0" ]
    ports:
      - "8502:8502"
    networks:
      - execution_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ops-portal.rule=PathPrefix(`/ops`)"
      - "traefik.http.routers.ops-portal.entrypoints=web"
      - "traefik.http.routers.ops-portal.middlewares=strip-ops,authentik@docker"
      - "traefik.http.middlewares.strip-ops.stripprefix.prefixes=/ops"
      - "traefik.http.services.ops-portal.loadbalancer.server.port=8502"

  # HIVE UI - Memex Interface (Lovelace-local, direct 2×5060Ti + live repo access)
  hive-ui:
    build:
      context: ../ui
      dockerfile: Dockerfile
      args:
        # Bake Lovelace agent_runtime address so browser WS terminal connects directly
        NEXT_PUBLIC_GATEWAY_URL: "http://192.168.2.101:8008"
    image: home-ai-lab/hive-ui:latest
    container_name: hive_ui_local
    restart: unless-stopped
    depends_on:
      - agent-runtime
    env_file:
      - ../network.env
    environment:
      - API_BASE_URL=http://agent_runtime:8000
      - MEMPALACE_BASE_URL=http://${HOPPER_IP:-192.168.2.102}:8200
      - LANGFUSE_URL=http://${HOPPER_IP:-192.168.2.102}:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - HOPPER_IP=${HOPPER_IP:-192.168.2.102}
      - NEXT_PUBLIC_GRAFANA_URL=http://${TURING_IP:-192.168.2.103}/grafana
      - GRAFANA_INTERNAL_URL=http://${TURING_IP:-192.168.2.103}/grafana
    extra_hosts:
      - "${HOPPER_HOST:-hopper}:${HOPPER_IP:-192.168.2.102}"
    volumes:
      - ../docs:/app/docs:ro
    ports:
      - "3300:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - execution_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hive-ui-local.rule=PathPrefix(`/hive`)"
      - "traefik.http.routers.hive-ui-local.entrypoints=web"
      - "traefik.http.services.hive-ui-local.loadbalancer.server.port=3000"

  # --- IDENTITY - Authentik DB ---
  authentik_db:
    image: postgres:12-alpine
    container_name: authentik_db
    restart: unless-stopped
    volumes:
      - database_authentik:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - POSTGRES_USER=authentik
      - POSTGRES_DB=authentik
    networks:
      - execution_net

  # --- IDENTITY - Authentik Redis ---
  authentik_redis:
    image: redis:alpine
    container_name: authentik_redis
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - redis_authentik:/data
    networks:
      - execution_net

  # --- IDENTITY - Authentik Server ---
  authentik_server:
    image: ghcr.io/goauthentik/server:2024.2.1
    container_name: authentik_server
    restart: unless-stopped
    command: server
    environment:
      - AUTHENTIK_REDIS__HOST=authentik_redis
      - AUTHENTIK_POSTGRESQL__HOST=authentik_db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
      # CRITICAL: Tell Authentik its external-facing hostname for OIDC discovery
      - AUTHENTIK_HOST=http://192.168.2.101:9000
      - AUTHENTIK_HOST_BROWSER=http://192.168.2.101:9000
    volumes:
      # Named volumes (not host binds): Docker seeds an empty named volume with
      # the image's dir ownership (UID 1000), so authentik can mkdir /media/public.
      # Host binds inherit the host folder's perms, which broke on the OneDrive path.
      - authentik_media:/media
      - authentik_templates:/templates
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      - authentik_db
      - authentik_redis
    networks:
      - execution_net

  # --- IDENTITY - Authentik Worker ---
  authentik_worker:
    image: ghcr.io/goauthentik/server:2024.2.1
    container_name: authentik_worker
    restart: unless-stopped
    command: worker
    environment:
      - AUTHENTIK_REDIS__HOST=authentik_redis
      - AUTHENTIK_POSTGRESQL__HOST=authentik_db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_DB_PASSWORD}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
    depends_on:
      - authentik_db
      - authentik_redis
    networks:
      - execution_net

  # ─────────────────────────────────────────────────────────────────
  # DIAGNOSTIC TOOL — Text Generation WebUI (oobabooga)
  # Purpose : Token inspection, logit viewer, advanced sampler controls
  # Role    : MarsRL output debugging — NOT in the request path
  # Start   : docker-compose --profile diagnostic up text-gen-webui -d
  # Stop    : docker-compose --profile diagnostic stop text-gen-webui
  # UI      : http://localhost:7860  |  Traefik: /tokenlab
  # Backend : Connects to existing Ollama — NO model duplication
  # ─────────────────────────────────────────────────────────────────
  text-gen-webui:
    image: atinoda/text-generation-webui:default-nightly
    container_name: text_gen_webui
    profiles:
      - diagnostic
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CLI_ARGS=--api --listen --listen-port 7860 --api-port 5000 --extensions openai
    volumes:
      - tgw_models:/home/user/text-generation-webui/models
      - tgw_loras:/home/user/text-generation-webui/loras
      - tgw_presets:/home/user/text-generation-webui/presets
    ports:
      - "7860:7860"   # Web UI
      - "5000:5000"   # OpenAI-compatible API
    networks:
      - execution_net
    restart: "no"    # Diagnostic only — do not auto-restart
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tgw.rule=PathPrefix(`/tokenlab`)"
      - "traefik.http.routers.tgw.entrypoints=web"
      - "traefik.http.routers.tgw.middlewares=strip-tokenlab,authentik@docker"
      - "traefik.http.middlewares.strip-tokenlab.stripprefix.prefixes=/tokenlab"
      - "traefik.http.services.tgw.loadbalancer.server.port=7860"

  # ── Container metrics for Prometheus scraping ──────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor-justin
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - execution_net
    restart: unless-stopped

  # TRAINING DISPATCHER — Accepts job requests from Turing, runs GRPO training on Lovelace GPUs
  # Auth: X-Dispatcher-Key header (DISPATCHER_SECRET env var)
  # Endpoint: http://192.168.2.101:8001
  training-dispatcher:
    build:
      context: ..
      dockerfile: execution_plane/Dockerfile
    image: home-ai-lab/agent-runtime:latest
    container_name: training_dispatcher
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - ../network.env
    environment:
      - PYTHONPATH=/app
      - DISPATCHER_SECRET=${DISPATCHER_SECRET}
      - TRAINING_OUTPUT_DIR=/workspace/training_output
      - TRAINING_DATASET_DIR=/workspace/training_data
      - TRAINING_BASE_SOLVER=${TRAINING_BASE_SOLVER:-Qwen/Qwen3.6-27B}
      - SECONDARY_OLLAMA_HOST=http://ollama:11434
      - HF_TOKEN=${HF_TOKEN:-}
      - FORCE_TRAIN=${FORCE_TRAIN:-0}
    volumes:
      - ../agents:/app/agents
      - ../:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["uvicorn", "agents.training.dispatcher:app", "--host", "0.0.0.0", "--port", "8001", "--log-level", "info"]
    ports:
      - "8001:8001"
    networks:
      - execution_net
    labels:
      - "traefik.enable=false"

  # ─────────────────────────────────────────────────────────────────
  # OPEN DESIGN — nexu-io/open-design daemon
  # Purpose : Design-intent UI generation (landing pages, dashboards,
  #           decks, prototypes) via 31 skills + 72 design systems.
  # Daemon API : http://192.168.2.101:7456  (LAN-accessible)
  # First build : ~10 min (clone + pnpm install + tsc build)
  #              Set SKIP_WEB_BUILD=1 to skip the Next.js static export
  #              and save ~4 min (no /design-studio UI, API still works).
  # Subsequent : Only Docker layer cache misses rebuilt (~1 min).
  # Start      : docker compose up -d open-design
  # ─────────────────────────────────────────────────────────────────
  open-design:
    build:
      context: .
      dockerfile: Dockerfile.open-design
      args:
        SKIP_WEB_BUILD: "${OD_SKIP_WEB_BUILD:-0}"
    image: home-ai-lab/open-design:latest
    container_name: open_design
    restart: unless-stopped
    ports:
      - "7456:7456"   # daemon REST + SSE API
    volumes:
      - open_design_data:/data
    environment:
      - OD_BIND_HOST=0.0.0.0
      - OD_DATA_DIR=/data
      - NODE_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - execution_net
    labels:
      - "traefik.enable=false"

  # DEV workspace — hot-reload runtime + separate UI instance on :8009/:3301
  agent-runtime-dev:
    image: home-ai-lab/agent-runtime:latest
    container_name: agent_runtime_dev
    restart: unless-stopped
    depends_on:
      - ollama
      - spire-agent
    env_file:
      - ../network.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - BMO_OLLAMA_HOST=http://ollama:11434
      - OPENHANDS_URL=http://openhands:3000
      - OPENHANDS_API_KEY=sk-sandbox-local
      - COMFYUI_HOST=http://comfyui_gpu:8188
      - KLEIN_HOST=http://klein_service:8189
      - EVICT_CONTAINER_RESTART=true
      - "VALID_API_KEYS={\"sk-coder-identity\": \"coding_user\", \"sk-devops-identity\": \"devops_user\"}"
      - OPEN_DESIGN_URL=http://open_design:7456
      - SWARM_DEVHARNESS_WORKERS=true
      - SPIFFE_ENDPOINT_SOCKET=unix:///var/run/spire/agent.sock
      - PYTHONPATH=/app
      - MEMPALACE_API_URL=${MEMPALACE_API_URL:-http://192.168.2.102:8200}
      - AGNO_DB_URL=${AGNO_DB_URL}
      - TEMPLATE_DB_URL=${TEMPLATE_DB_URL}
      - REDIS_HOST=192.168.2.102
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - GPU_LOCK_HOST=http://localhost:8000
      - HOME_ASSISTANT_TOKEN=${HOME_ASSISTANT_TOKEN}
      - BMO_LLM_MODEL=qwen3:14b
      - HOME_LAT=${HOME_LAT:-41.8781}
      - HOME_LON=${HOME_LON:--87.6298}
      - HOME_CITY=${HOME_CITY:-your area}
      - PRIMARY_MODEL=${PRIMARY_MODEL:-qwen3:14b}
      - ROUTER_MODEL=${ROUTER_MODEL:-qwen3:8b}
      - ARCHITECT_MODEL=${ARCHITECT_MODEL:-qwen3:14b}
      - COORDINATOR_MODEL=${COORDINATOR_MODEL:-qwen3:14b}
      - LIBRARIAN_MODEL=${LIBRARIAN_MODEL:-qwen3:14b}
      - CONV_MODEL=${CONV_MODEL:-qwen3:14b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      # Bridges the no-Authentik-header gap on Lovelace; Authentik headers take priority if present
      - DEV_OWNER_UID=misterobots
    volumes:
      - ../agents:/app/agents
      - ../:/workspace
      - C:/Users/panca/Documents/ComfyUI/ComfyUI/output:/app/comfy_io/output
