tls:
  options:
    default:
      sniStrict: true
    securetls:
      minVersion: VersionTLS12
      sniStrict: true
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

http:
  middlewares:
    globalHeaders:
      headers:
        hostsProxyHeaders:
          - X-Forwarded-Host
        customResponseHeaders:
          server: ""
          x-xss-protection: ""
        frameDeny: false
        contentTypeNosniff: true
    secureHeaders:
      headers:
        sslProxyHeaders:
          X-Forwarded-Proto: https
    dropsecurityheaders:
      headers:
        accessControlAllowCredentials: true
        accessControlAllowHeaders: "*"
        accessControlAllowMethods: "*"
        accessControlAllowOriginList: "*"
        accessControlExposeHeaders: "*"
        accessControlMaxAge: 100000
        customResponseHeaders:
          content-security-policy: ""
          cross-origin-opener-policy: ""
          permissions-policy: ""
          referrer-policy: ""
          x-frame-options: ""
          x-webkit-csp: ""
    hsts:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
    robotHeaders:
      headers:
        customResponseHeaders:
          X-Robots-Tag: none,noarchive,nosnippet,notranslate,noimageindex
    cf-https-proto:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
    authentik:
      forwardAuth:
        address: http://authentik:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
  serversTransports:
    skipverify:
      insecureSkipVerify: true
  routers:
    authentik-cf-http:
      rule: "Host(`auth.shivelymedia.com`)"
      entryPoints: [web]
      priority: 50
      service: authentik-cf-http
      middlewares: [globalHeaders@file, robotHeaders@file, cf-https-proto@file]
    authentik-secure:
      rule: "Host(`auth.shivelymedia.com`)"
      entryPoints: [websecure]
      priority: 50
      service: authentik-cf-http
      middlewares: [globalHeaders@file, secureHeaders@file, robotHeaders@file]
      tls:
        certResolver: cfdns
    authentik-outpost-cf-http:
      rule: "PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: [web]
      priority: 100
      service: authentik-cf-http
      middlewares: [globalHeaders@file, cf-https-proto@file]
    authentik-outpost-secure:
      rule: "PathPrefix(`/outpost.goauthentik.io/`)"
      entryPoints: [websecure]
      priority: 100
      service: authentik-cf-http
      middlewares: [globalHeaders@file]
      tls:
        certResolver: cfdns
    sonarr-web:
      rule: "Host(`sonarr.shivelymedia.com`)"
      entryPoints: [web]
      priority: 50
      service: sonarr
      middlewares: [globalHeaders@file, robotHeaders@file, cf-https-proto@file, authentik@file]
    sonarr-secure:
      rule: "Host(`sonarr.shivelymedia.com`)"
      entryPoints: [websecure]
      priority: 50
      service: sonarr
      middlewares: [globalHeaders@file, secureHeaders@file, robotHeaders@file, authentik@file]
      tls:
        certResolver: cfdns
    radarr-web:
      rule: "Host(`radarr.shivelymedia.com`)"
      entryPoints: [web]
      priority: 50
      service: radarr
      middlewares: [globalHeaders@file, robotHeaders@file, cf-https-proto@file, authentik@file]
    radarr-secure:
      rule: "Host(`radarr.shivelymedia.com`)"
      entryPoints: [websecure]
      priority: 50
      service: radarr
      middlewares: [globalHeaders@file, secureHeaders@file, robotHeaders@file, authentik@file]
      tls:
        certResolver: cfdns
    sabnzbd-web:
      rule: "Host(`sabnzbd.shivelymedia.com`)"
      entryPoints: [web]
      priority: 50
      service: sabnzbd
      middlewares: [globalHeaders@file, robotHeaders@file, cf-https-proto@file, authentik@file]
    sabnzbd-secure:
      rule: "Host(`sabnzbd.shivelymedia.com`)"
      entryPoints: [websecure]
      priority: 50
      service: sabnzbd
      middlewares: [globalHeaders@file, secureHeaders@file, robotHeaders@file, authentik@file]
      tls:
        certResolver: cfdns
    seerr-web:
      rule: "Host(`seerr.shivelymedia.com`)"
      entryPoints: [web]
      priority: 50
      service: seerr
      middlewares: [globalHeaders@file, robotHeaders@file, cf-https-proto@file, authentik@file]
    seerr-secure:
      rule: "Host(`seerr.shivelymedia.com`)"
      entryPoints: [websecure]
      priority: 50
      service: seerr
      middlewares: [globalHeaders@file, secureHeaders@file, robotHeaders@file, authentik@file]
      tls:
        certResolver: cfdns
    jellyfin-local:
      rule: "Host(`jellyfin.shivelymedia.com`)"
      entryPoints: [web]
      priority: 50
      service: jellyfin
      middlewares: [globalHeaders@file]
    # --- Friday Persona Studio (Phase B external route) — NOT YET DEPLOYED ------------------------
    # Exposes ONLY the persona editor (/personas) + its CRUD API (/api/personas) to the outside,
    # carved out of the existing memex.shivelymedia.com host (same working CF tunnel + wildcard cert)
    # at a higher priority than the memex-ext catch-all (20) — same pattern as grafana-memex (30).
    # Backend is the CROSS-HOST friday_brain on Lovelace (192.168.2.101:8000); Traefik on Turing can
    # reach it over the LAN (the CF proxy can't, but Traefik->LAN is fine). Gated by authentik@file
    # (SSO) AND, when set, friday_brain's own FRIDAY_PERSONA_TOKEN — double-gated for external use.
    # Friday's chat endpoints (/api/chat, /v1/*) are deliberately NOT routed here.
    # DEPLOY (human, on Turing): sync this dynamic.yml to Turing's traefik bind-mount, set a strong
    # FRIDAY_PERSONA_TOKEN in execution_plane/.env on Lovelace and recreate friday-brain, then verify
    # an authenticated browser hit to https://memex.shivelymedia.com/personas. Traefik file provider
    # hot-reloads — no restart needed. Confirm zero errors in `docker logs traefik` after the sync.
    friday-personas-secure:
      rule: "Host(`memex.shivelymedia.com`) && (PathPrefix(`/personas`) || PathPrefix(`/api/personas`))"
      entryPoints: [websecure]
      priority: 40
      service: friday-personas
      middlewares: [globalHeaders@file, secureHeaders@file, robotHeaders@file, authentik@file]
      tls:
        certResolver: cfdns
    friday-personas-http:
      rule: "Host(`memex.shivelymedia.com`) && (PathPrefix(`/personas`) || PathPrefix(`/api/personas`))"
      entryPoints: [web]
      priority: 40
      service: friday-personas
      middlewares: [globalHeaders@file, robotHeaders@file, cf-https-proto@file, authentik@file]
    # Friday image attachments: no Authentik redirect, because the Android Companion
    # fetches notification images without an interactive browser session. Access is
    # restricted by agent_runtime's HMAC signature and short expiry; only this path is
    # exposed, never the generic /delivered_artifacts directory or the rest of the API.
    friday-images-secure:
      rule: "Host(`memex.shivelymedia.com`) && PathPrefix(`/v1/public-artifacts/`)"
      entryPoints: [websecure]
      priority: 50
      service: friday-images
      middlewares: [globalHeaders@file, secureHeaders@file, robotHeaders@file]
      tls:
        certResolver: cfdns
    friday-images-http:
      rule: "Host(`memex.shivelymedia.com`) && PathPrefix(`/v1/public-artifacts/`)"
      entryPoints: [web]
      priority: 50
      service: friday-images
      middlewares: [globalHeaders@file, robotHeaders@file, cf-https-proto@file]
  services:
    authentik-cf-http:
      loadBalancer:
        servers:
          - url: http://authentik:9000
    sonarr:
      loadBalancer:
        servers:
          - url: http://sonarr:8989
    radarr:
      loadBalancer:
        servers:
          - url: http://radarr:7878
    sabnzbd:
      loadBalancer:
        servers:
          - url: http://sabnzbd:8080
    seerr:
      loadBalancer:
        servers:
          - url: http://seerr:5055
    jellyfin:
      loadBalancer:
        servers:
          - url: http://jellyfin:8096
    # Cross-host backend for the Friday Persona Studio (Phase B, see routers above). friday_brain
    # runs on Lovelace, not Turing, so this is a LAN URL, not a Docker-DNS name.
    friday-personas:
      loadBalancer:
        servers:
          - url: http://192.168.2.101:8000
    friday-images:
      loadBalancer:
        servers:
          - url: http://192.168.2.101:8000
