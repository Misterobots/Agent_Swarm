global:
  resolve_timeout: 5m
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'
  opsgenie_api_url: 'https://api.opsgenie.com/'

route:
  receiver: "default-receiver"
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    - receiver: "default-receiver"
      group_by: ['env', 'instance']

receivers:
  - name: "default-receiver"
    email_configs:
      - to: 'Justin@shivelymail.com'
        from: 'Admin@Graceful-Tech.com'
        smarthost: 'smtp.zoho.com:587'
        auth_username: 'Admin@Graceful-Tech.com'
        auth_identity: 'Admin@Graceful-Tech.com'
        # Password is materialized from $ALERT_SMTP_PASSWORD by the container
        # entrypoint (see turing_gateway/docker-compose.yml alertmanager service).
        # The file is written to an in-container tmpfs and never persisted to
        # the repo or to disk.
        auth_password_file: /tmp/secrets/smtp_password
        require_tls: true
        send_resolved: true
    webhook_configs:
      - url: 'https://notify.shivelymedia.com/home-ai-alerts'
        send_resolved: true
        # Bearer token written to tmpfs by the alertmanager container's entrypoint
        # (see turing_gateway/docker-compose.yml). Sourced from $NTFY_ALERT_TOKEN.
        http_config:
          authorization:
            type: Bearer
            credentials_file: /tmp/secrets/ntfy_token

inhibit_rules: []
